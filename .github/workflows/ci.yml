name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: prorate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d prorate_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/prorate_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            extension/package-lock.json
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npm ci --prefix extension
      - run: npm run typecheck --prefix client
      - run: npm test --prefix client
      - run: npm run build --prefix client
      - run: npm run build --prefix server
      - run: npm run db:migrate --prefix server
      - run: npm test --prefix server
      - run: npm test --prefix extension
